spring.application.name=quadra-aberta-api

# Conexão com Banco de Dados (PostgreSQL) - Fallback local com suporte a variáveis de ambiente (Nuvem: Neon / Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quadra_aberta_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgressecret}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Configuração de JWT
quadraaberta.jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f}
quadraaberta.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Configurações do Cloudinary (Armazenamento de Fotos de Zeladoria)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo-quadraaberta}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo-secret}

# Limites de Upload de Arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (Domínios permitidos)
quadraaberta.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://quadra-aberta.vercel.app}

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method