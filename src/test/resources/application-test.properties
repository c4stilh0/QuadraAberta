spring.application.name=quadra-aberta-api-test

# Configuração de Banco H2 em Memória para Testes
spring.datasource.url=jdbc:h2:mem:quadra_aberta_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL gerenciado para testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway desabilitado no perfil de teste (Hibernate gera schema em memória)
spring.flyway.enabled=false

# JWT para ambiente de teste
quadraaberta.jwt.secret=test-secret-key-12345678901234567890123456789012345678901234567890
quadraaberta.jwt.expiration-hours=2

# Cloudinary Mock / Teste
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# CORS
quadraaberta.cors.allowed-origins=http://localhost:3000
